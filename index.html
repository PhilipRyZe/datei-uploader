<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philips Datei-Uploader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Philips<br>Anonymer Datei-Uploader</h1>
        <p class="subtitle">
            Datei hochladen, Link teilen. Kein Konto, keine Namen – der Link läuft
            automatisch ab.<br>Erstellt mithilfe von KI.
        </p>

        <div class="usage-meter">
            <div class="usage-bar-track">
                <div id="usageBar" class="usage-bar-fill"></div>
            </div>
            <p id="usageLabel" class="usage-label">Speicherstand wird geladen…</p>
        </div>

        <div id="dropzone" class="dropzone">
            <p id="dropzone-text">Datei hierher ziehen oder klicken zum Auswählen</p>
            <input type="file" id="fileInput" hidden>
        </div>

        <div id="fileInfo" class="file-info hidden">
            <span id="fileName"></span>
            <span id="fileSize"></span>
        </div>

        <div class="expiry-row">
            <label>Link läuft ab nach:</label>
            <div class="expiry-toggle" role="group" aria-label="Ablaufzeit wählen">
                <button type="button" class="expiry-btn" data-days="1">1 Tag</button>
                <button type="button" class="expiry-btn active" data-days="7">7 Tage</button>
            </div>
        </div>

        <button id="uploadButton" disabled>Hochladen</button>

        <div id="progressContainer" class="progress-container hidden">
            <div id="progressBar" class="progress-bar"></div>
            <span id="progressLabel">0%</span>
        </div>

        <div id="result" class="result hidden">
            <p>Dein Link zum Teilen:</p>
            <div class="shortlink-container">
                <input id="shareUrl" type="text" readonly>
                <button id="copyButton">Kopieren</button>
            </div>
            <p class="expiry-note" id="expiryNote"></p>
        </div>

        <p id="message"></p>

        <a href="admin.html" class="admin-link">Verwaltung öffnen</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
